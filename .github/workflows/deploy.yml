name: Deploy BetterBodies preview to GitHub Pages

"on":
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - publish-services
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DEPLOY_TARGET: pages
      APPS_SCRIPT_URL: ${{ vars.APPS_SCRIPT_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Inspect build output
        run: |
          echo "Current directory:"
          pwd
          echo "Repository root:"
          ls -la
          echo "Dist output:"
          find dist -maxdepth 3 -type f | sort
          echo "Checking required files:"
          test -f dist/index.html
          test -f dist/deploy-check.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
